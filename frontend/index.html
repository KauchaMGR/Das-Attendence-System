<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Document character encoding -->
    <meta charset="UTF-8" />

    <!-- Make the page responsive on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Browser tab title -->
    <title>Attendance System</title>
  </head>

  <body>
    <!-- React will render the entire app inside this root element -->
    <div id="root"></div>

    <!--
      Load the Vite-powered React entry file.
      type="module" lets the browser use ES modules directly.
      /src/main.jsx is the app bootstrap file in the frontend source.
    -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
